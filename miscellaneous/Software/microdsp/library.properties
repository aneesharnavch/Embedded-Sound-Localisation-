name=microdsp
version=2.0.0
author=Aneesh Arnav Chikkala <aneesharnavchikkala@gmail.com>
maintainer=Aneesh Arnav Chikkala <aneesharnavchikkala@gmail.com>
sentence=Digital signal processing for microcontrollers: statistics, filters, FFT and calculus on fixed-size buffers or live sample streams.
paragraph=Provides mean, standard deviation and robust outlier detection; moving-average, median, Gaussian, FIR, Kaiser-designed and adaptive LMS/NLMS filters; an allocation-free radix-2 FFT and IFFT with Hann/Hamming/Blackman windows; numerical derivatives and integrals; and sliding-window versions of all of these for streaming sensor data. Runs on AVR as well as 32-bit targets, using no C++ standard library containers and no heap allocation in the hot paths.
category=Data Processing
